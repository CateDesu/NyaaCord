name: Prune old releases

on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to keep (leave empty for newest stable release)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: nyaacord-prune-releases
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Release pruning regression tests
        run: python3 .github/test_prune_releases.py

      - name: Keep newest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 .github/prune_releases.py --tag "$RELEASE_TAG"
          else
            python3 .github/prune_releases.py
          fi
